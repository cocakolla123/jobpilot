<!doctype html><html><head><meta charset="utf-8"><title>LinkedIn</title></head><body><main>
<h2>Resumes and application data</h2>
<ul id="list"></ul>
<button id="more" aria-label="Show more resumes">+2 more resumes</button>
<div><button type="button" onclick="document.getElementById('resume-upload-button').click()">Upload resume</button>
<input type="file" id="resume-upload-button" name="file" hidden> DOC, DOCX, PDF (5MB)</div>
</main>
<script>
  // like LinkedIn: names are button text, and older ones hide behind "+N more"
  // kept across reloads, like the real site
  const files = JSON.parse(sessionStorage.getItem('files') || 'null') || ['Jane_Doe_Resume_FDE.pdf', 'Jane_Doe_Resume_AI.pdf', 'Jane_Doe_Resume_FDE.pdf', 'Jane_Doe_Resume_SWE.pdf', 'Old_Resume_A.pdf', 'Old_Resume_B.pdf'];
  let expanded = false;
  const draw = () => {
    const shown = expanded ? files : files.slice(0, 4);
    document.getElementById('list').innerHTML = shown.map((f) => `<li><h3>${f}</h3> Uploaded on 10/1/2026 <button>Show options for ${f}</button></li>`).join('');
    document.getElementById('more').style.display = expanded || files.length <= 4 ? 'none' : '';
  };
  document.getElementById('more').onclick = () => { expanded = true; draw(); };
  document.getElementById('resume-upload-button').onchange = (e) => { const f = e.target.files[0].name; setTimeout(() => { files.unshift(f); sessionStorage.setItem('files', JSON.stringify(files)); draw(); }, 600); };
  draw();
</script></body></html>
