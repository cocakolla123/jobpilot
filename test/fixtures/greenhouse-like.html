<!doctype html>
<html><head><meta charset="utf-8"><title>Greenhouse-like application</title></head>
<body>
<form id="application_form" onsubmit="return false">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="field"><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin" type="text"></div>
  <div class="field"><label>Resume/CV *</label><input id="resume" name="resume" type="file" accept=".pdf,.docx"></div>

  <fieldset class="application-question">
    <legend>Are you legally authorized to work in the United States? *</legend>
    <input type="radio" id="auth_yes" name="authorized" value="yes"><label for="auth_yes">Yes</label>
    <input type="radio" id="auth_no" name="authorized" value="no"><label for="auth_no">No</label>
  </fieldset>
  <fieldset class="application-question">
    <legend>Will you now or in the future require sponsorship for employment visa status? *</legend>
    <input type="radio" id="sp_yes" name="sponsorship" value="yes"><label for="sp_yes">Yes</label>
    <input type="radio" id="sp_no" name="sponsorship" value="no"><label for="sp_no">No</label>
  </fieldset>

  <div class="field"><label for="why">Why do you want to work here? *</label><textarea id="why" name="why" required></textarea></div>

  <div class="field">
    <label for="gender">Gender</label>
    <select id="gender" name="gender">
      <option value="">Please select</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="decline">Decline To Self Identify</option>
    </select>
  </div>

  <div class="field"><input type="checkbox" id="consent" name="consent" required><label for="consent">I agree to the privacy policy *</label></div>
  <button type="submit">Submit Application</button>
</form>
</body></html>
