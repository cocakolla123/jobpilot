<!doctype html>
<html><head><meta charset="utf-8"><title>Consent boxes</title></head>
<body>
<!-- tick boxes; some of them state a fact about you -->
<form onsubmit="return false">
  <div class="field"><input type="checkbox" id="privacy" name="privacy" required><label for="privacy">I agree to the privacy policy *</label></div>
  <div class="field"><input type="checkbox" id="auth" name="auth" required><label for="auth">I certify that I am legally authorized to work in the United States *</label></div>
  <div class="field"><input type="checkbox" id="spon" name="spon" required><label for="spon">I confirm that I will not require visa sponsorship now or in the future *</label></div>
  <div class="field"><input type="checkbox" id="sms" name="sms"><label for="sms">I agree to receive marketing text messages</label></div>
  <div class="field"><input type="checkbox" id="age" name="age" required><label for="age">I confirm I am at least 18 years old *</label></div>
</form>
</body></html>
